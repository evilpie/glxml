<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search the OpenGL XML registry for constants, values, commands, parameter groups, extensions, and core versions.">
  <title>OpenGL Registry Reference</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="registry.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <h1><a class="brand" href="#">OpenGL Registry Reference</a></h1>
    <a class="header-link" href="https://registry.khronos.org/OpenGL/index_gl.php" target="_blank" rel="noopener noreferrer">Official registry ↗</a>
  </header>
  <main>
    <section class="hero">
      <p>Search constants, commands, parameter groups, extensions, and versions from <code>gl.xml</code>.</p>
      <div class="search-wrap">
        <label for="search">Search the registry</label>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Try GL_TEXTURE_MAX_ANISOTROPY or 0x84FE" aria-controls="results">
        <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" hidden>×</button>
      </div>
      <div class="filters" role="group" aria-label="Result type">
        <button class="filter active" data-kind="all" aria-pressed="true">All <span id="count-all"></span></button>
        <button class="filter" data-kind="enum" aria-pressed="false">Constants <span id="count-enum"></span></button>
        <button class="filter" data-kind="command" aria-pressed="false">Commands <span id="count-command"></span></button>
        <button class="filter" data-kind="extension" aria-pressed="false">Extensions <span id="count-extension"></span></button>
        <button class="filter" data-kind="feature" aria-pressed="false">Versions <span id="count-feature"></span></button>
        <button class="filter" data-kind="group" aria-pressed="false">Groups <span id="count-group"></span></button>
      </div>
    </section>
    <section class="workspace" aria-label="Registry browser">
      <div class="list-panel">
        <div class="panel-heading"><span id="result-heading">Browse registry</span><span id="result-count"></span></div>
        <div id="results" class="results"></div>
        <button id="more" class="more" hidden>Show more results</button>
      </div>
      <article id="detail" class="detail-panel" aria-live="polite"></article>
    </section>
  </main>
  <footer>Generated from <code>gl.xml</code>. Registry membership comes from XML; specification links point to Khronos. <span id="source"></span></footer>
</body>
</html>
